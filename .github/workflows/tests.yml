name: Adapters architecture contracts
on:
  push:
    branches: [primitives_redesign]
  pull_request:
jobs:
  host-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: {repository: ESPressio-Development-Platform/ESPressio-System, ref: primitives_redesign, path: deps/ESPressio-System}
      - uses: actions/checkout@v4
        with: {repository: ESPressio-Development-Platform/ESPressio-Primitive, ref: primitives_redesign, path: deps/ESPressio-Primitive}
      - uses: actions/checkout@v4
        with: {repository: ESPressio-Development-Platform/ESPressio-Task, ref: primitives_redesign, path: deps/ESPressio-Task}
      - name: Configure generic Adapter contracts
        run: cmake -S tests -B build -DESPRESSIO_DEPENDENCIES="$GITHUB_WORKSPACE/deps"
      - name: Build generic Adapter contracts
        run: cmake --build build --parallel
      - name: Run generic Adapter contracts
        run: ctest --test-dir build --output-on-failure
      - name: Publish Adapter resource accounting
        run: ./build/adapter_resources
  esp32-surface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.x'}
      - run: pip install platformio
      - name: Compile full A1/Q1/A2 surface without RTTI
        run: |
          mkdir -p /tmp/adapters/src
          cat > /tmp/adapters/platformio.ini <<'PIO'
          [env:esp32dev]
          platform = espressif32
          board = esp32dev
          framework = arduino
          lib_deps =
              file://${{ github.workspace }}
              https://github.com/ESPressio-Development-Platform/ESPressio-System.git#primitives_redesign
              https://github.com/ESPressio-Development-Platform/ESPressio-Primitive.git#primitives_redesign
              https://github.com/ESPressio-Development-Platform/ESPressio-Task.git#primitives_redesign
          build_unflags = -std=gnu++11 -frtti
          build_flags = -std=gnu++17 -fno-rtti
          PIO
          cat > /tmp/adapters/src/main.cpp <<'CPP'
          #include <Arduino.h>
          #include <ESPressio_Adapters.hpp>
          using namespace ESPressio::Adapters;
          using Arena=StaticByteArena<ByteClass<128,1>>;
          using Domain=StaticCapacityDomain<512,1,Arena>;
          using In=CapacityPlane<AdapterDirection::Inbound,Domain,Domain,Domain,Domain,Domain,Domain,Domain,Domain>;
          using Out=CapacityPlane<AdapterDirection::Outbound,Domain,Domain,Domain,Domain,Domain,Domain,Domain>;
          using Runtime=AdapterRuntime<In,Out,2,2,1,1,2>;
          using Resources=AdapterRuntimeResourceAccounting<In,Out,2,2,1,1,2>;
          static_assert(Resources::RuntimeObjectBytes==sizeof(Runtime));
          static ESPressio::Primitive::PrimitiveAdmissionDisposition admit(void*,ESPressio::Primitive::PrimitiveProtocolVersion,AdapterByteView,const AdapterSemanticProvenance&) noexcept { return ESPressio::Primitive::PrimitiveAdmissionDisposition::Accepted; }
          static AdapterEncodeResult encode(void*,ESPressio::Primitive::PrimitiveProtocolVersion,std::uint64_t,const void*,AdapterMutableByteView out) noexcept { if(!out.Capacity)return{};out.Data[0]=1;return{AdapterResourceStatus::Success,1}; }
          static bool validate(void*) noexcept { return true; }
          static LowerTransportSubmitResult submit(void*,AdapterRecordIdentity,ESPressio::Primitive::PrimitiveFamilyId,ESPressio::Primitive::PrimitiveProtocolVersion,const ESPressio::Primitive::PrimitivePolicyDescriptor&,AdapterServiceClass,AdapterByteView,AdapterRouteToken) noexcept { return{LowerTransportDisposition::Accepted,1,false}; }
          Runtime runtime;
          int owner=0;
          void setup(){AdapterBindingDescriptor binding{};binding.Family=1;binding.Protocols={1,1};binding.MaximumInboundBytes=64;binding.MaximumOutboundBytes=64;binding.ServiceClassMask=std::uint8_t{1}<<static_cast<unsigned>(AdapterServiceClass::Responsive);binding.Owner=&owner;binding.AdmitInbound=&admit;binding.EncodeOutbound=&encode;LowerTransportBinding transport{};transport.Owner=&owner;transport.Submit=&submit;transport.Validate=&validate;transport.ServiceClassMask=0x3f;(void)runtime.BindFamily(binding);(void)runtime.BindTransport(transport);(void)runtime.Initialize();(void)runtime.Start();}
          void loop(){}
          CPP
          pio run -d /tmp/adapters
