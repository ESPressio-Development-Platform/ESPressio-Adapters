name: Apply neutral lower-transport metadata propagation

on:
  push:
    branches:
      - primitives_redesign

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: primitives_redesign
      - name: Propagate family and protocol to lower transport
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/detail/ESPressio_AdapterRuntimePrivate.inc')
          s=p.read_text()
          old='const auto submitted=_transport.Submit(_transport.Owner,lease.Identity(),record.Service,record.Bytes.View(),record.Route);'
          new='const auto submitted=_transport.Submit(_transport.Owner,lease.Identity(),record.Family,record.Protocol,record.Service,record.Bytes.View(),record.Route);'
          if old not in s:
              raise SystemExit('expected lower transport submit call not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit neutral propagation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/detail/ESPressio_AdapterRuntimePrivate.inc
          git commit -m "Propagate neutral family metadata to lower transport"
          git push origin HEAD:primitives_redesign
